<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature conversion</title>
    <link rel="stylesheet" href="TEMP_CONVERT.css">
</head>
<body>
<div id = "container">
    <p id = "para" >Temperature Conversion</p>
    <input id = "input1" type="number" placeholder="Temperature">
<div id = "Celsius">
    <input id = "radio1" type="radio" name = "cli">
    <label id = "label1" for="radio1">Celsius to Fahrenheit</label>
</div>
<div id = "Fahrenheit">
    <input id = "radio2" type="radio" name = "cli">
    <label id = "label2" for="radio2">Fahrenheit to Celsius </label>
</div>
<div id = "lastpart">
    <button id = "submit">Submit</button>
</div>  
    <p id = "display"></p>  
</div> 
    <script src = "TEMP_CONVERT.js"></script>
</body>
</html>
